<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Test AR Proximité - Cubes 3D</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded vr-mode-ui="enabled: false;" arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-box position="0 0 -4" rotation="0 45 0" color="#E60000" scale="1 1 1"></a-box>
      <a-text value="DEVANT (ROUGE)" position="0 1 -4" align="center" color="#FFFFFF" width="10"></a-text>

      <a-box position="4 0 0" rotation="0 45 0" color="#00FF00" scale="1 1 1"></a-box>
      <a-text value="DROITE (VERT)" position="4 1 0" rotation="0 -90 0" align="center" color="#FFFFFF" width="10"></a-text>

      <a-box position="-4 0 0" rotation="0 45 0" color="#0000FF" scale="1 1 1"></a-box>
      <a-text value="GAUCHE (BLEU)" position="-4 1 0" rotation="0 90 0" align="center" color="#FFFFFF" width="10"></a-text>

      <a-box position="0 0 4" rotation="0 45 0" color="#FFFF00" scale="1 1 1"></a-box>
      <a-text value="DERRIERE (JAUNE)" position="0 1 4" rotation="0 180 0" align="center" color="#FFFFFF" width="10"></a-text>

      <a-camera look-controls near="0.1" far="1000"></a-camera>
      
    </a-scene>
  </body>
</html>
